/* =========================================================================
   [공유 순위 설정] Firebase Realtime Database URL을 넣으면
   학생들이 각자 기기로 접속해도 순위가 함께 집계됩니다.
   예: 'https://내프로젝트-default-rtdb.asia-southeast1.firebasedatabase.app'
   ========================================================================= */
var RTDB_URL = '';

function nickKey(nick) {
  return encodeURIComponent(String(nick).trim().toLowerCase()).replace(/\./g, '%2E');
}

async function syncBestRank(prevBest, newBest) {
  if (!me || newBest <= prevBest) return false;
  if (!RTDB_URL) return true;
  var base = RTDB_URL.replace(/\/+$/, '');
  var key = nickKey(me.nick);
  try {
    var res = await fetch(base + '/ranks/' + key + '.json');
    var existing = res.ok ? await res.json() : null;
    var remoteFloor = (existing && typeof existing.floor === 'number') ? existing.floor : 0;
    if (newBest > remoteFloor) {
      await fetch(base + '/ranks/' + key + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nick: me.nick,
          floor: newBest,
          updatedAt: Date.now()
        })
      });
    }
    return true;
  } catch (e) {
    return false;
  }
}

async function fetchSharedRanks() {
  if (!RTDB_URL) return null;
  var base = RTDB_URL.replace(/\/+$/, '');
  try {
    var res = await fetch(base + '/ranks.json');
    if (!res.ok) return null;
    var data = await res.json();
    if (!data || typeof data !== 'object') return [];
    return Object.keys(data)
      .map(function (k) {
        var item = data[k] || {};
        return { nick: item.nick || decodeURIComponent(k), floor: Number(item.floor) || 0 };
      })
      .sort(function (a, b) { return b.floor - a.floor; })
      .slice(0, 15);
  } catch (e) {
    return null;
  }
}

function tower(){var f=me.best+1,s=stats(),boss=f%10==0,el=!boss&&f%5==0,H=30+10*f,A=3+1.2*f,mobs=boss?[{h:H*4,a:A*2,s:200,t:1,n:'보스 골렘'}]:el?[{h:H*2.2,a:A*1.4,s:170,t:1,n:'거대 골렘 · 정예'},{h:H,a:A,s:100,n:'골렘'},{h:H,a:A,s:100,n:'골렘'}]:[{h:H,a:A,s:100,n:'골렘'},{h:H,a:A,s:100,n:'골렘'},{h:H,a:A,s:100,n:'골렘'}],hp=s.hp,dodge=Math.min(.4,s.agi*.008),atk=s.str+s.int*.5,log=[],rounds=0;
