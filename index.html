<!doctype html>
<html lang="ko">
<head>

<title>5학년 2학기의 탑</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#17121c;--pn:#241c2c;--bd:#3b2f48;--tx:#f3ece4;--mu:#cfc4d6;--em:#ff9a3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-size:18px}
#app{max-width:1100px;margin:0 auto;padding:14px}
.pn{background:var(--pn);border:2px solid var(--bd);padding:14px;margin-bottom:12px}

button{font-family:inherit;font-size:19px;color:var(--tx);background:#2e2438;border:2px solid #5a4f66;padding:10px 16px;cursor:pointer;min-height:44px}

button.go{background:var(--em);color:#1b1208;border-color:var(--em)}
button.sm{font-size:15px;padding:4px 10px;min-height:32px}
input{font-family:inherit;font-size:20px;padding:10px;background:#17121c;color:var(--tx);border:2px solid #5a4f66;width:100%;margin:6px 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-block;border:2px solid var(--bd);background:var(--pn);padding:5px 12px;margin:2px;color:var(--mu)}
.slot{text-align:left;display:block;width:100%;min-height:84px;padding:8px 10px;border-width:3px}
.slot.e{border-style:dashed;color:var(--mu);background:#1f1826}
.bar{height:12px;background:#17121c;margin:3px 0 8px}.bar i{display:block;height:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:22px;min-height:56px}
.ok{background:#2f7a38!important;border-color:#6fcf7a!important}.no{background:#7a2f2f!important;border-color:#e5523c!important}
.mu{color:var(--mu);font-size:16px}
.hs{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
.hl{flex:0 0 380px;max-width:100%}.hc{flex:1 1 280px;min-width:260px}.hr{flex:0 0 310px;max-width:100%}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sl{display:flex;flex-direction:column;justify-content:space-between;min-height:102px;padding:8px;background:#2e2438;border:3px solid #6b6270}
.sl-top{display:flex;align-items:center;gap:8px}
.sl-bot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.sl.e{background:#1f1826;border:3px dashed #5a4f66;color:var(--mu)}
.ic{width:46px;height:46px;flex:none;background:#17121c}
.nm{font-size:15px;line-height:1.2}.sb{font-size:12px;color:#cfc4d6;margin-top:2px}
.scene{position:relative;height:100%;min-height:520px;background:#2a2130;border:2px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
.pl{position:absolute;top:14px;left:0;right:0;text-align:center}.pl span{display:inline-block;background:#17121c;border:2px solid var(--bd);padding:6px 16px;font-size:19px}
.btns{display:flex;gap:14px;flex-wrap:wrap}.btns button{flex:1;min-width:240px;height:64px;font-size:24px}
.stage{position:relative;background:#2a2130;border:2px solid var(--bd);display:flex;align-items:flex-end;justify-content:space-around;padding:18px 10px 12px;min-height:310px;margin-bottom:12px;flex-wrap:wrap;gap:12px}
.unit{position:relative;text-align:center;min-width:120px;transition:transform .16s ease,opacity .3s ease}
.unit.dead{opacity:.35;transform:scale(.92)}
.unit.hit{animation:sk .4s ease}
.hpw{width:124px;margin:0 auto 6px;background:#17121c;border:2px solid var(--bd);padding:3px}

.cw{position:relative;width:210px;text-align:center;margin:8px auto}
.cb{background:none;border:0;padding:0;min-height:0;cursor:pointer;display:block;margin:0 auto}
.cb svg{width:180px;height:180px;display:block}
.cb:focus-visible{outline:3px solid var(--em)}

@keyframes bu{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(var(--bs));opacity:0}}
.bu{position:absolute;left:50%;top:80px;width:24px;height:24px;border-radius:50%;pointer-events:none;animation:bu .9s ease-out forwards}
@keyframes pt{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.pt{position:absolute;left:50%;top:80px;width:8px;height:8px;pointer-events:none;animation:pt 1s ease-out forwards}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}.fl{position:fixed;inset:0;pointer-events:none;z-index:9;animation:fl .8s ease-out forwards}
@keyframes ss{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-2px)}}#app.ss{animation:ss .6s linear}
@keyframes ri{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}.rc{animation:ri .5s ease-out;margin-top:6px}
@media (prefers-reduced-motion:reduce){.pt,.fl{display:none}.idle,.sk,#app.ss{animation:none}}

/* --- graphics polish --- */
.scene,.stage{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='32' shape-rendering='crispEdges'><rect width='64' height='32' fill='%232a2130'/><rect width='64' height='2' fill='%231c1522'/><rect y='16' width='64' height='2' fill='%231c1522'/><rect x='30' width='2' height='16' fill='%231c1522'/><rect x='62' y='16' width='2' height='16' fill='%231c1522'/><rect x='6' y='6' width='10' height='2' fill='%23322839'/><rect x='38' y='22' width='12' height='2' fill='%23322839'/></svg>");background-size:128px 64px;image-rendering:pixelated}
.scene::before,.stage::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:#3a2f3f;border-top:5px solid #4b3f50;z-index:0}
.unit{z-index:1}
.sprite{display:block;margin:0 auto;animation:bob 1.6s ease-in-out infinite}
.unit:nth-child(even) .sprite{animation-delay:-.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{position:absolute;top:60px;width:40px;height:80px}
.tg{position:absolute;left:-40px;top:-20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,60,.3),transparent 65%);animation:flk 1.2s ease-in-out infinite;pointer-events:none}
.torch .fl{animation:flk2 .5s steps(2,jump-none) infinite;transform-origin:center bottom}
@keyframes flk{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes flk2{0%{transform:scaleY(1)}100%{transform:scaleY(1.12)}}
h1{text-shadow:2px 2px 0 #000}
button{box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12)}
.cb,.cb:active{box-shadow:none;transform:none}
button:active:not(:disabled):not(.cb){transform:translateY(2px)}
button.go{box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
.pn{box-shadow:inset 0 0 0 2px #120d17,0 3px 0 #0e0a12}
.sl{box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.sprite,.tg,.torch .fl{animation:none}}
</style>

async function syncBestRank(prevBest, newBest) {
  if (!me || !currentUid || newBest <= prevBest) return false;
  try {
    const rankRef = ref(db, 'ranks/' + currentUid);
    const snap = await get(rankRef);
    const existing = snap.exists() ? snap.val() : null;
    const remoteFloor = existing && typeof existing.floor === 'number' ? existing.floor : 0;

    return true;
  } catch (e) { console.warn('순위 동기화 실패:', e); return false; }
}
async function fetchSharedRanks() {
  if (!currentUid) return null;
  try {
    const snap = await get(ref(db, 'ranks'));
    const data = snap.exists() ? snap.val() : {};
    return Object.keys(data || {}).map(uid => ({ nick: data[uid]?.nick || '학생', floor: Number(data[uid]?.floor) || 0 }))

function buildFloorMobs(f, H, A) {

    return { title: '보스의 방', list: [{ id: 0, kind: bKind, tier: 'boss', h: Math.round(H * 4.2), max: Math.round(H * 4.2), a: A * 2.1, s: 175, t: 1, n: bName }] };
  }
  if (el) {
    var ePool = [
      { kind: 'orc', n: '오크 대장 · 정예', subKind: 'goblin', subN: '고블린 정찰병' },
      { kind: 'skeleton', n: '해골 기사 · 정예', subKind: 'slime', subN: '숲 슬라임' },

      ]
    };
  }
  var sets = [
    { title: '초원 슬라임의 방', m: [{ kind: 'slime', n: '숲 슬라임' }, { kind: 'slime', n: '초록 슬라임' }, { kind: 'goblin', n: '숲 고블린' }] },

    { title: '해골 유적의 방', m: [{ kind: 'skeleton', n: '해골 병사' }, { kind: 'skeleton', n: '해골 궁수' }, { kind: 'imp', n: '작은 임프' }] },
    { title: '오크 요새의 방', m: [{ kind: 'orc', n: '오크 전사' }, { kind: 'goblin', n: '고블린 투사' }, { kind: 'orc', n: '오크 방패병' }] },
    { title: '화염 석실의 방', m: [{ kind: 'imp', n: '불꽃 임프' }, { kind: 'golem', n: '돌 골렘' }, { kind: 'skeleton', n: '해골 마법사' }] }

function login(msg) {
  if (btTimer) { clearTimeout(btTimer); btTimer = null; }
  app.innerHTML = '<div class="pn" style="max-width:460px;margin:40px auto"><h1>5학년 2학기의 탑</h1><p class="mu">학생 닉네임과 비밀번호로 가입하거나 로그인하세요. 실명은 쓰지 마세요. 비밀번호는 6자 이상으로 정해 주세요.</p><label>닉네임<input id="n" maxlength="10" autocomplete="username" placeholder="예: 용감한토끼"></label><label>비밀번호 (6자 이상)<input id="p" type="password" minlength="6" autocomplete="current-password" placeholder="비밀번호"></label><p id="m" style="color:#ff9a3c;min-height:24px">' + esc(msg || '') + '</p><div class="row"><button class="go" id="a">로그인</button><button id="b">학생 회원가입</button></div><p class="mu">닉네임은 중복될 수 없습니다. 비밀번호를 잊으면 계정 복구가 어려우니 안전하게 기억해 주세요.</p></div>';
  function values() { return [document.getElementById('n').value.trim(), document.getElementById('p').value]; }
  function message(t) { const el=document.getElementById('m'); if(el) el.textContent=t; }
  function valid(x) {
    if (!/^[가-힣a-zA-Z0-9_-]{2,10}$/.test(x[0])) { message('닉네임은 한글·영문·숫자·_·-로 2~10자 입력해 주세요.'); return false; }
    if (x[1].length < 6) { message('비밀번호는 6자 이상 입력해 주세요.'); return false; }
    return true;
  }
  async function enter(isNew) {
    const x=values(); if(!valid(x)) return;
    const buttons=app.querySelectorAll('button'); buttons.forEach(b=>b.disabled=true);
    message(isNew?'학생 계정을 만들고 있습니다...':'로그인하고 기록을 불러오는 중입니다...');
    try {
      const email=studentEmail(x[0]);
      const credential=isNew ? await createUserWithEmailAndPassword(auth,email,x[1]) : await signInWithEmailAndPassword(auth,email,x[1]);
      currentUid=credential.user.uid;
      let profile=await loadCloudProfile(currentUid);
      if(!profile && store[x[0]]) { profile=JSON.parse(JSON.stringify(store[x[0]])); delete profile.pin; }
      if(!profile) profile={nick:x[0],gear:{},best:0,pity:[0,0,0],wrong:{},shards:0,enh:{},baseStat:{str:BASE.str,hp:BASE.hp,agi:BASE.agi,int:BASE.int},potions:1};
      profile.nick=x[0]; delete profile.pin;
      me=normProfile(profile); store[x[0]]=me; save(); home(isNew?'학생 계정이 만들어졌습니다!':'로그인했습니다.');
    } catch(e) {
      console.error(e); const code=e?.code;
      const msg=code==='auth/email-already-in-use'?'이미 사용 중인 닉네임입니다.':
        (code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')?'닉네임 또는 비밀번호를 확인해 주세요.':
        code==='auth/weak-password'?'비밀번호는 6자 이상이어야 합니다.':
        code==='auth/network-request-failed'?'인터넷 연결을 확인해 주세요.':'인증 오류가 발생했습니다. Firebase 설정을 확인해 주세요. ('+(code||'오류')+')';
      message(msg); buttons.forEach(b=>b.disabled=false);
    }
  }
  document.getElementById('a').onclick=()=>enter(false);
  document.getElementById('b').onclick=()=>enter(true);
}

function home(note) {
  if (btTimer) { clearTimeout(btTimer); btTimer = null; }
  normProfile(me);
  var s = stats(), n = 0, mx = MAX_STAT, col = { str: '#e5523c', hp: '#4caf50', agi: '#f5b301', int: '#4a90e2' };
  SL.forEach(function (x) { if (me.gear[x[0]] != null) n++; });
  var slots = SL.map(function (x) {
    var k = x[0], st = x[3], r = me.gear[k], lv = me.enh[k] || 0, cost = enhCost(k), rate = Math.round(enhSuccessRate(k) * 100);
    if (r == null) return '<div class="sl e"><div class="sl-top"><div class="ic"></div><div><div class="nm">' + x[1] + '</div><div class="sb">' + x[2] + ' · 비어 있음</div></div></div></div>';
    var bon = slotBonus(k, st, r), maxed = lv >= MAX_ENH;
    return '<div class="sl" style="border-color:' + M[r] + '">' +
      '<div class="sl-top">' + icon(k, r) + '<div><div class="nm" style="color:' + M[r] + '">' + R[r] + ' ' + x[1] + (lv > 0 ? ' <span style="color:#ff9a3c">+' + lv + '</span>' : '') + '</div><div class="sb">' + x[2] + ' · ' + SN[st] + ' +' + bon + '</div></div></div>' +
      '<div class="sl-bot"><span class="sb">' + (maxed ? '최대 강화(+9)' : '재료 ' + cost + '개 · 성공 ' + rate + '%') + '</span>' +
      (maxed ? '<button type="button" class="sm" disabled>완료</button>' : '<button type="button" class="sm btn-enh" data-k="' + k + '"' + (me.shards < cost ? ' disabled' : '') + '>강화</button>') +
      '</div></div>';
  }).join('');

  var bars = ['str', 'hp', 'agi', 'int'].map(function (k) {
    var bVal = clampStat(me.baseStat[k]), tCost = baseTrainCost(k), tGain = baseTrainGain(k), isFull = bVal >= MAX_STAT;
    return '<div style="margin-top:8px">' + SN[k] + ' <span class="mu">(기본 ' + bVal + ' / ' + MAX_STAT + ')</span><b style="float:right">' + s[k] + '</b></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, Math.max(4, Math.log10(s[k] + 10) / Math.log10(MAX_STAT + 10) * 100)) + '%;background:' + col[k] + '"></i></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<span class="sb">기본 +' + tGain + ' (재료 ' + tCost + '개)</span>' +
      '<button type="button" class="sm btn-tr" data-st="' + k + '"' + (isFull || me.shards < tCost ? ' disabled' : '') + '>' + (isFull ? '한도 도달' : '능력치 훈련') + '</button></div>';
  }).join('');

      var partName = SL.find(function (x) { return x[0] === k; })[1];
      if (Math.random() < rate) {
        me.enh[k] = lv + 1;
        save();
        home('<b style="color:#6fcf7a">' + partName + ' +' + me.enh[k] + ' 강화 성공!</b> (성공률 ' + Math.round(rate * 100) + '% · 남은 재료 ' + me.shards + '개)');
      } else {
        save();
        home('<b style="color:#ef4444">' + partName + ' +' + (lv + 1) + ' 강화 실패…</b> (성공률 ' + Math.round(rate * 100) + '% · 재료 ' + cost + '개 소모, 단계 유지 · 남은 재료 ' + me.shards + '개)');
      }
    };
  });

  [].forEach.call(document.querySelectorAll('.btn-tr'), function (btn) {
    btn.onclick = function () {
      var sk = btn.dataset.st;
      var curBase = clampStat(me.baseStat[sk]);
      if (curBase >= MAX_STAT) return;
      var cost = baseTrainCost(sk);
      if (me.shards < cost) return;
      var gain = baseTrainGain(sk);
      me.shards -= cost;
      me.baseStat[sk] = Math.min(MAX_STAT, curBase + gain);
      save();
      home('<b style="color:#7db3ff">기본 ' + SN[sk] + ' +' + (me.baseStat[sk] - curBase) + ' 상승!</b> (현재 기본 ' + me.baseStat[sk] + ' / ' + MAX_STAT + ' · 남은 재료 ' + me.shards + '개)');
    };
  });
}

function pickPart() {
  app.innerHTML = '<div class="top"><h1>시험장 <span class="mu">어느 부위를 노릴까요?</span></h1><button id="bk">돌아가기</button></div><div class="pn"><div class="sg">' +
    SL.map(function (x, i) {
      var r = me.gear[x[0]], lv = me.enh[x[0]] || 0;
      return '<button class="slot' + (r == null ? ' e' : '') + '" data-i="' + i + '" style="' + (r != null ? 'border-color:' + M[r] : '') + '">' +
        x[1] + ' · ' + x[2] + (lv > 0 ? ' +' + lv : '') + '<div class="mu">' + (r == null ? '비어 있음' : '지금 ' + R[r]) + ' · ' + SN[x[3]] + '</div></button>';
    }).join('') + '</div></div>';
  document.getElementById('bk').onclick = function () { home(); };
  [].forEach.call(document.querySelectorAll('.slot'), function (b) { b.onclick = function () { exam(+b.dataset.i); }; });
}

function pick(sub) {
  var bank = QB[sub].map(function (t, i) { var p = t.split('|'); return { q: p[0], o: p.slice(1), id: sub + i }; }), out = [];
  for (var k = 0; k < 3; k++) {
    var tot = 0, ws = bank.map(function (x) { var w = 1 + 2 * (me.wrong[x.id] || 0); tot += w; return w; }), r = Math.random() * tot, i = 0;
    while (r > ws[i] && i < ws.length - 1) { r -= ws[i]; i++; }
    out.push(bank.splice(i, 1)[0]);
  }
  return out;
}

function exam(si) {
  var sl = SL[si], qs = pick(sl[2]), i = 0, ok = 0;
  function show() {
    var q = qs[i], os = shuf(q.o.map(function (t, j) { return { t: t, c: j == 0 }; }));
    app.innerHTML = '<div class="top"><h1>시험장 <span class="mu">' + sl[1] + ' · ' + sl[2] + '</span></h1><span class="chip">문제 ' + (i + 1) + ' / 3</span></div><div class="pn"><div style="font-size:26px;line-height:1.5;margin-bottom:10px">' + esc(q.q) + '</div>' +
      os.map(function (o, j) { return '<button class="opt" data-j="' + j + '">' + (j + 1) + '. ' + esc(o.t) + '</button>'; }).join('') + '</div>';
    [].forEach.call(document.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        var o = os[+b.dataset.j];
        [].forEach.call(document.querySelectorAll('.opt'), function (x) { x.disabled = true; if (os[+x.dataset.j].c) x.className += ' ok'; });
        if (o.c) ok++; else { b.className += ' no'; if (q.id) me.wrong[q.id] = (me.wrong[q.id] || 0) + 1; }
        save();
        setTimeout(function () { i++; i < 3 ? show() : done(); }, 1100);
      };
    });
  }
  function done() {
    var bx = ok >= 3 ? 2 : ok >= 2 ? 1 : 0;
    app.innerHTML = '<div class="pn" style="max-width:520px;margin:30px auto;text-align:center"><h1>시험 결과</h1><p style="font-size:26px">3문제 중 ' + ok + '문제 정답</p><p class="mu">' + (bx ? '상자를 ' + bx + '개 받았어요!' + (ok == 3 ? ' (만점 보너스!)' : '') : '2문제 이상 맞히면 상자를 받아요. 다시 도전해 봐요.') + '</p><button class="go" id="nx">' + (bx ? '상자 열기' : '돌아가기') + '</button></div>';
    document.getElementById('nx').onclick = function () { bx ? open(si, bx, ok == 3) : home(); };
  }
  show();
}

function roll(bonus) {
  var one = function () { var r = Math.random() * 100, k = 0; while (k < R.length - 1 && r >= PR[k]) { r -= PR[k]; k++; } return k; };
  var p = me.pity, k = one();
  if (bonus) k = Math.max(k, one());
  if (p[2] >= 99) k = 5;
  else if (p[1] >= 39) k = Math.max(k, 4);
  else if (p[0] >= 9) k = Math.max(k, 2);
  p[0] = k >= 2 ? 0 : p[0] + 1;
  p[1] = k >= 4 ? 0 : p[1] + 1;
  p[2] = k >= 5 ? 0 : p[2] + 1;
  return k;
}

function chest(o, r) {
  var g = o ? '<rect x="3" y="6" width="10" height="2" fill="' + L[r] + '"/><rect x="4" y="5" width="8" height="1" fill="#fff"/>' : '',
      lid = o ? '<rect x="2" y="1" width="12" height="3" fill="#a06a30"/><rect x="3" y="0" width="10" height="1" fill="#c48a48"/><rect x="2" y="3" width="12" height="1" fill="#5e3b1a"/>' : '<rect x="2" y="3" width="12" height="4" fill="#a06a30"/><rect x="2" y="3" width="12" height="1" fill="#c48a48"/><rect x="2" y="6" width="12" height="1" fill="#5e3b1a"/>';
  return '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="상자">' + g + '<rect x="2" y="7" width="12" height="7" fill="#8a5a2b"/><rect x="2" y="7" width="12" height="1" fill="#b07a3c"/><rect x="2" y="12" width="12" height="2" fill="#5e3b1a"/><rect x="4" y="3" width="1" height="11" fill="#5a4f66"/><rect x="11" y="3" width="1" height="11" fill="#5a4f66"/>' + (o ? '' : '<rect x="7" y="6" width="2" height="3" fill="#f5b301"/>') + lid + '</svg>';
}

var FX = [
  { n: 6, bs: 3, f: 0 },
  { n: 12, bs: 5, f: 0 },
  { n: 20, bs: 7, f: .3 },
  { n: 30, bs: 9, f: .5 },
  { n: 42, bs: 11, f: .7, s: 1 },
  { n: 56, bs: 14, f: .9, s: 1 }
];

function open(si, n, bonus) {
  normProfile(me);
  var sl = SL[si], left = n, h = '';
  for (var i = 0; i < n; i++) h += '<div class="cw" id="c' + i + '"><button class="cb idle" data-i="' + i + '" aria-label="상자 ' + (i + 1) + ' 열기">' + chest(0) + '</button><div class="mu">' + (i + 1) + '번 상자 · 눌러서 열기</div></div>';
  app.innerHTML = '<div style="max-width:560px;margin:10px auto;text-align:center"><h1>상자가 도착했어요!</h1><p class="mu">상자를 눌러 열어 보세요 (' + sl[1] + ' · ' + sl[2] + ')</p><div class="row" style="justify-content:center">' + h + '</div>' +
    '<div class="pn mu">확률: ' + R.map(function (x, i) { return '<span style="color:' + M[i] + '">' + x + ' ' + PR[i] + '%</span>'; }).join(' · ') +
    '<br>희귀 이상 보장까지 <b id="py" style="color:var(--em)">' + (10 - me.pity[0]) + '</b>상자 · 보유 재료 <b id="shc" style="color:#7db3ff">' + me.shards + '개</b></div>' +
    '<button class="go" id="bk" style="width:100%" disabled>상자를 모두 열어야 돌아갈 수 있어요</button></div>';
  document.getElementById('bk').onclick = function () { home(); };
  [].forEach.call(document.querySelectorAll('.cb'), function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, w = document.getElementById('c' + i); b.disabled = true; b.className = 'cb sk';
      setTimeout(function () {
        var r = roll(bonus && i == 0), cur = me.gear[sl[0]], up = cur == null || r > cur, fx = FX[r], gotShards = 0;
        if (up) {
          me.gear[sl[0]] = r;
        } else {
          gotShards = SHARD_DROP[r] || 1;
          me.shards = (me.shards || 0) + gotShards;
        }
        save();
        var val = slotBonus(sl[0], sl[3], up ? r : cur);
        b.className = 'cb'; b.innerHTML = chest(1, r);
        var bu = document.createElement('div'); bu.className = 'bu'; bu.style.cssText = 'background:' + M[r] + ';box-shadow:0 0 30px 12px ' + L[r] + ';--bs:' + fx.bs; w.appendChild(bu);
        for (var k = 0; k < fx.n; k++) {
          var p = document.createElement('div'), a = Math.random() * 6.283, d = 50 + Math.random() * (60 + r * 40);
          p.className = 'pt'; p.style.cssText = 'background:' + [M[r], L[r], '#fff'][k % 3] + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d - 20) + 'px';
          w.appendChild(p);
        }
        if (fx.f) { var fl = document.createElement('div'); fl.className = 'fl'; fl.style.background = L[r]; fl.style.opacity = fx.f; document.body.appendChild(fl); setTimeout(function () { fl.remove(); }, 900); }
        if (fx.s) { app.classList.add('ss'); setTimeout(function () { app.classList.remove('ss'); }, 650); }
        setTimeout(function () {
          var c = document.createElement('div'); c.className = 'pn rc'; c.style.cssText = 'border:3px solid ' + M[r] + ';margin-bottom:0';
          c.innerHTML = '<div style="color:' + M[r] + ';font-size:26px">' + R[r] + ' ' + sl[1] + '</div><div>' + SN[sl[3]] + ' +' + val + '</div><div class="mu">' + (up ? '장착했어요! 아바타가 바뀌었어요.' : '이미 더 좋은 장비가 있어서 <b style="color:#7db3ff">재료 +' + gotShards + '개</b>로 분해했어요!') + '</div>';
          w.appendChild(c);
          var q = document.getElementById('py'); if (q) q.textContent = 10 - me.pity[0];
          var sc = document.getElementById('shc'); if (sc) sc.textContent = me.shards + '개';
          left--; if (left == 0) { var bk = document.getElementById('bk'); bk.disabled = false; bk.textContent = '대장간으로'; }
        }, 650);
      }, 700);
    };
  });
}

function tower() {
  if (btTimer) { clearTimeout(btTimer); btTimer = null; }
  normProfile(me);
  var f = (Number(me.best) || 0) + 1;
  var s = stats();
  var H = 30 + 10 * f + Math.pow(Math.max(0, f - 15), 1.65) * 4;
  var A = 3 + 1.2 * f + Math.pow(Math.max(0, f - 15), 1.55) * 1.1;
  var room = buildFloorMobs(f, H, A), mobs = room.list;
  var hp = s.hp, maxHp = s.hp, dodge = Math.min(.45, s.agi * .002), atk = s.str + s.int * .6, rounds = 0, heroTurn = true, fast = false, done = false;
  var dropPotions = 0, dropShards = 0;
  var weak = SL.slice().sort(function (a, b) { return (me.gear[a[0]] == null ? -1 : me.gear[a[0]]) - (me.gear[b[0]] == null ? -1 : me.gear[b[0]]); })[0];

  app.innerHTML = '<div class="top"><h1>' + f + '층 <span class="mu">' + esc(room.title) + ' · 무한</span></h1><div><button id="pot">물약 (<span id="pot-n">' + me.potions + '</span>)</button> <button id="spd">빨리감기</button> <button id="bk">나가기</button></div></div>' +
    '<div class="stage">' +
    '<div class="unit" id="u-hero"><div class="hpw"><div style="font-size:14px;color:var(--em)">' + esc(me.nick) + '</div><div class="hpt"><div class="hpf" id="hp-hero" style="width:100%"></div></div><div class="mu" id="hpt-hero" style="font-size:12px">' + hp + ' / ' + maxHp + '</div></div>' + av(me.gear, 110) + '</div>' +
    mobs.map(function (m) {
      return '<div class="unit" id="u-mob-' + m.id + '"><div class="hpw"><div style="font-size:14px;color:' + (m.t ? '#c78cff' : '#cfc4d6') + '">' + esc(m.n) + '</div><div class="hpt"><div class="hpf mob" id="hp-mob-' + m.id + '" style="width:100%"></div></div><div class="mu" id="hpt-mob-' + m.id + '" style="font-size:12px">' + m.h + ' / ' + m.max + '</div></div>' + mobSvg(m.kind, m.s, m.t) + '</div>';
    }).join('') +
    '</div>' +
    '<div class="pn" id="bpanel"><h2>전투 중…</h2><div class="blog" id="blog"><div>' + f + '층 (' + esc(room.title) + ') 전투 시작!</div></div><div id="bend"></div></div>';

  document.getElementById('bk').onclick = function () { if (btTimer) { clearTimeout(btTimer); btTimer = null; } home(); };
  document.getElementById('spd').onclick = function () { fast = true; this.disabled = true; };
  document.getElementById('pot').onclick = function () {
    if (done || me.potions <= 0 || hp >= maxHp) return;
    me.potions -= 1;
    var heal = Math.max(15, Math.round(maxHp * 0.4));
    hp = Math.min(maxHp, hp + heal);
    save();
    syncHp();
    var pn = document.getElementById('pot-n'); if (pn) pn.textContent = me.potions;
    log('<span style="color:#6fcf7a">체력 물약 사용! 체력 +' + heal + ' 회복</span>');
  };

  function log(msg) {
    var elLog = document.getElementById('blog'); if (!elLog) return;
    var d = document.createElement('div'); d.innerHTML = msg; elLog.appendChild(d); elLog.scrollTop = elLog.scrollHeight;
  }
  function hitAnim(id) {
    var u = document.getElementById(id); if (!u) return;
    u.classList.remove('hit'); void u.offsetWidth; u.classList.add('hit');
  }
  function syncHp() {
    var hb = document.getElementById('hp-hero'), ht = document.getElementById('hpt-hero'), pb = document.getElementById('pot');
    if (hb) hb.style.width = Math.max(0, hp / maxHp * 100) + '%';
    if (ht) ht.textContent = Math.max(0, Math.round(hp)) + ' / ' + maxHp;
    if (pb) pb.disabled = done || me.potions <= 0 || hp >= maxHp;
    mobs.forEach(function (m) {
      var mb = document.getElementById('hp-mob-' + m.id), mt = document.getElementById('hpt-mob-' + m.id), mu = document.getElementById('u-mob-' + m.id);
      if (mb) mb.style.width = Math.max(0, m.h / m.max * 100) + '%';
      if (mt) mt.textContent = Math.max(0, Math.round(m.h)) + ' / ' + m.max;
      if (mu && m.h <= 0) mu.classList.add('dead');
    });
  }
  function onMobKilled(m) {
    var chance = (m.tier === 'boss') ? 1 : (m.tier === 'elite' ? 0.65 : 0.35);
    if (Math.random() < chance) {
      if (m.tier === 'boss' || Math.random() < 0.55) {
        me.potions = (me.potions || 0) + 1;
        dropPotions++;
        save();
        log('<span style="color:#6fcf7a">★ ' + esc(m.n) + ' 드롭: 체력 물약 +1개!</span>');
      } else {
        var sh = (m.tier === 'elite') ? 2 : 1;
        me.shards = (me.shards || 0) + sh;
        dropShards += sh;
        save();
        log('<span style="color:#7db3ff">★ ' + esc(m.n) + ' 드롭: 강화 재료 +' + sh + '개!</span>');
      }
      var pn = document.getElementById('pot-n'); if (pn) pn.textContent = me.potions;
    }
  }
  function finish(win) {
    if (done) return; done = true;
    if (!win) { var hu = document.getElementById('u-hero'); if (hu) hu.classList.add('dead'); }
    var prevBest = Number(me.best) || 0, isNew = win && f > prevBest;
    if (isNew) { me.best = f; save(); syncBestRank(prevBest, me.best); }
    var h2 = document.querySelector('#bpanel h2');
    if (h2) h2.textContent = win ? '승리! ' + f + '층 돌파' : '패배… 몹이 너무 강해요';
    var lootTxt = (dropPotions || dropShards) ? ' · 획득: ' + (dropPotions ? '물약 ' + dropPotions + '개 ' : '') + (dropShards ? '재료 ' + dropShards + '개' : '') : '';
    log(win ? '<b style="color:#6fcf7a">' + f + '층 클리어!' + (isNew ? ' (최고 기록 갱신!)' : '') + lootTxt + '</b>' : '<b style="color:#e5523c">전투 패배…' + lootTxt + '</b>');
    var bend = document.getElementById('bend');
    if (bend) {
      bend.innerHTML = '<p class="mu">' + rounds + '라운드 · 남은 체력 ' + Math.max(0, Math.round(hp)) + ' / ' + maxHp + lootTxt + '</p>' +
        (win ? '' : '<p>힘 ' + s.str + ' 체력 ' + s.hp + ' 민첩 ' + s.agi + ' 지능 ' + s.int + ' · 보유 재료 ' + me.shards + '개 — 가장 약한 칸은 <b style="color:#ff9a3c">' + weak[1] + ' (' + weak[2] + ')</b>이에요.</p>') +
        '<div class="row"><button class="go" id="bk2">대장간으로</button>' + (win ? '<button id="nx">다음 층 도전 (' + (f + 1) + '층)</button>' : '') + '</div>';
      document.getElementById('bk2').onclick = function () { home(); };
      if (win) document.getElementById('nx').onclick = tower;
    }
    var sp = document.getElementById('spd'); if (sp) sp.style.display = 'none';
    var bk = document.getElementById('bk'); if (bk) bk.style.display = 'none';
    syncHp();
  }
  function tick() {
    if (done) return;
    var alive = mobs.filter(function (m) { return m.h > 0; });
    if (alive.length === 0) return finish(true);
    if (hp <= 0 || rounds >= 1500) return finish(false);
    var delay = fast ? 35 : 420;
    if (heroTurn) {
      rounds++;
      var t = alive[0], dmg = Math.max(1, Math.round(atk * (.85 + Math.random() * .3)));
      t.h -= dmg; hitAnim('u-mob-' + t.id);
      log('[' + rounds + 'R] ' + esc(me.nick) + ' → ' + esc(t.n) + '에게 <b>' + dmg + '</b> 피해' + (t.h <= 0 ? ' (' + esc(t.n) + ' 처치!)' : ''));
      if (t.h <= 0) onMobKilled(t);
      syncHp();
      if (mobs.every(function (m) { return m.h <= 0; })) { btTimer = setTimeout(function () { finish(true); }, delay); return; }
      heroTurn = false;
    } else {
      var a = alive[rounds % alive.length];
      if (Math.random() < dodge) {
        log('[' + rounds + 'R] ' + esc(a.n) + ' 공격 회피!');
      } else {
        var md = Math.max(1, Math.round(a.a * (.85 + Math.random() * .3)));
        hp -= md; hitAnim('u-hero'); syncHp();
        log('[' + rounds + 'R] ' + esc(a.n) + ' → <b>' + md + '</b> 피해');
      }
      if (hp <= 0) { btTimer = setTimeout(function () { finish(false); }, delay); return; }
      heroTurn = true;
    }
    btTimer = setTimeout(tick, delay);
  }
  syncHp();
  btTimer = setTimeout(tick, 300);
}

async function rank() {
  if (btTimer) { clearTimeout(btTimer); btTimer = null; }
  var rows = [], sh = false; var shared = await fetchSharedRanks();
  if (Array.isArray(shared)) { rows = shared; sh = true; }
  if (!sh) rows = Object.keys(store).map(function (k) { return { nick: store[k].nick, floor: store[k].best }; }).sort(function (a, b) { return b.floor - a.floor; }).slice(0, 10);
  app.innerHTML = '<div class="top"><h1>순위 <span class="mu">최고 도달 층수</span></h1><button id="bk">돌아가기</button></div><div class="pn"><p class="mu">' + (sh ? '모두의 순위' : '이 기기에서의 순위 (공유 순위는 연결되지 않았어요)') + '</p>' +
    rows.map(function (r, i) { return '<div style="padding:8px 0;border-bottom:1px solid var(--bd)">' + (i + 1) + '위 &nbsp; ' + esc(r.nick) + '<b style="float:right">' + (+r.floor || 0) + '층</b></div>'; }).join('') + '</div>';
  document.getElementById('bk').onclick = function () { home(); };
}

const initialUser = await new Promise(resolve => {
  const stop = onAuthStateChanged(auth, user => { stop(); resolve(user); });
});
if (initialUser) {
  currentUid=initialUser.uid;
  try { const restored=await loadCloudProfile(currentUid); if(restored){me=normProfile(restored);store[me.nick]=me;save();home();}else login(); }
  catch(e){login('저장된 기록을 불러오지 못했습니다. 다시 로그인해 주세요.');}
} else { login(); }
